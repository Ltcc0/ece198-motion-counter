<text x="393" y="915" text-anchor="middle" font-size="21" class="muted">中央沟槽：左右两侧不相通</text>
<text x="750" y="632" class="body" font-weight="600">示例：传感器脚与跳线插在同一编号</text>

<text x="750" y="682" font-size="25" style="fill:#d9363e">VCC  → e10；a10 → 主板 5V</text>
<text x="750" y="735" font-size="25" style="fill:#b67c00">Trig → e11；a11 → 主板 D9</text>
<text x="750" y="788" font-size="25" style="fill:#2876d2">Echo → e12；a12 → 主板 D10</text>
<text x="750" y="841" font-size="25" style="fill:#2c3540">GND  → e13；a13 → 主板 GND</text>

<text x="750" y="904" class="small muted">四个传感器脚必须占四个不同编号。</text>
<text x="60" y="966" class="small muted">VCC / Trig / Echo / GND 以传感器印字为准；若摆放反向，按实际引脚修改对应行的接线。</text>
</svg>