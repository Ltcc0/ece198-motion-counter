<rect width="1400" height="1000" fill="#ffffff"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#182534} .muted{fill:#586675} .small{font-size:22px} .body{font-size:26px} .label{font-size:29px;font-weight:600} .mono{font-family:Menlo,Consolas,monospace}</style>
<text x="60" y="66" font-size="42" font-weight="700">动作计数器：四根线怎么接</text>
<text x="60" y="110" class="body muted">按引脚文字接线，图中位置为示意。接线前先拔下 USB。</text>
<rect x="60" y="158" width="300" height="300" rx="14" fill="#f2f7fc" stroke="#cad7e5" stroke-width="2"/>
<text x="84" y="198" class="label">HC-SR04</text>
<text x="84" y="226" class="small muted">超声波传感器</text>
<rect x="750" y="158" width="300" height="300" rx="14" fill="#f1f8f6" stroke="#b8d8cf" stroke-width="2"/>
<text x="773" y="198" class="label">UNO R4 Minima</text>
<text x="773" y="226" class="small muted">Arduino 主板</text>

<text x="328" y="273" text-anchor="end" class="label mono">VCC</text><line x1="360" y1="264" x2="750" y2="264" stroke="#d9363e" stroke-width="6"/><circle cx="360" cy="264" r="7" fill="#d9363e"/><circle cx="750" cy="264" r="7" fill="#d9363e"/><text x="776" y="273" class="label mono">5V</text><rect x="506" y="244" width="98" height="34" fill="white"/><text x="555" y="270" text-anchor="middle" font-size="23" style="fill:#d9363e">电源</text>
<text x="328" y="325" text-anchor="end" class="label mono">Trig</text><line x1="360" y1="316" x2="750" y2="316" stroke="#b67c00" stroke-width="6"/><circle cx="360" cy="316" r="7" fill="#b67c00"/><circle cx="750" cy="316" r="7" fill="#b67c00"/><text x="776" y="325" class="label mono">D9</text><rect x="506" y="296" width="98" height="34" fill="white"/><text x="555" y="322" text-anchor="middle" font-size="23" style="fill:#b67c00">触发</text>
<text x="328" y="377" text-anchor="end" class="label mono">Echo</text><line x1="360" y1="368" x2="750" y2="368" stroke="#2876d2" stroke-width="6"/><circle cx="360" cy="368" r="7" fill="#2876d2"/><circle cx="750" cy="368" r="7" fill="#2876d2"/><text x="776" y="377" class="label mono">D10</text><rect x="506" y="348" width="98" height="34" fill="white"/><text x="555" y="374" text-anchor="middle" font-size="23" style="fill:#2876d2">回波</text>
<text x="328" y="429" text-anchor="end" class="label mono">GND</text><line x1="360" y1="420" x2="750" y2="420" stroke="#2c3540" stroke-width="6"/><circle cx="360" cy="420" r="7" fill="#2c3540"/><circle cx="750" cy="420" r="7" fill="#2c3540"/><text x="776" y="429" class="label mono">GND</text><rect x="506" y="400" width="98" height="34" fill="white"/><text x="555" y="426" text-anchor="middle" font-size="23" style="fill:#2c3540">接地</text>

<line x1="1050" y1="327" x2="1145" y2="327" stroke="#617084" stroke-width="5"/>
<text x="1097" y="296" text-anchor="middle" font-size="20" class="mono">USB-C</text>
<text x="1097" y="357" text-anchor="middle" font-size="19" class="muted">数据线</text>
<rect x="1145" y="251" width="202" height="135" rx="8" fill="#fafbfc" stroke="#617084" stroke-width="3"/>
<path d="M1131 393 H1361 L1348 405 H1144 Z" fill="#e3e9f0" stroke="#617084" stroke-width="2"/>
<text x="1246" y="226" text-anchor="middle" class="label">MacBook</text>
<text x="1246" y="305" text-anchor="middle" font-size="24">串口监视器</text>
<text x="1246" y="344" text-anchor="middle" class="small muted">显示与操作</text>
<text x="60" y="500" class="small muted">主板上数字 9、10 对应 D9、D10。供电使用标着 5V 的孔，GND 使用标着 GND 的孔。</text>
<line x1="60" y1="531" x2="1340" y2="531" stroke="#dce2e8" stroke-width="2"/>
<text x="60" y="580" font-size="32" font-weight="700">面包板：同一编号、同一侧的五个孔相通</text>
